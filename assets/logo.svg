<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="100%" height="100%">
  <defs>
    <linearGradient id="ggRed1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3843"/>
      <stop offset="100%" stop-color="#C7101E"/>
    </linearGradient>
    <linearGradient id="ggRed2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA2C39"/>
      <stop offset="100%" stop-color="#AD0B17"/>
    </linearGradient>
    <linearGradient id="ggRedFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B28"/>
      <stop offset="100%" stop-color="#73050E"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF2433" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group Emblem -->
  <g transform="translate(60, 20)" filter="url(#logoGlow)">
    <!-- Top Slanted Bar -->
    <polygon points="120,15 185,15 70,130 5,130" fill="url(#ggRed1)"/>

    <!-- Middle Folded Horizontal Wing -->
    <polygon points="115,95 188,95 105,178 52,125" fill="url(#ggRed2)"/>

    <!-- Lower Fold Flap -->
    <polygon points="105,178 185,232 135,232 78,168" fill="url(#ggRedFold)"/>
  </g>

  <!-- Typography -->
  <text x="180" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="4" fill="#FFFFFF">GLOBAL</text>
  <text x="180" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="4" fill="#FFFFFF">GROUP</text>
</svg>
